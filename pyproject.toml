[tool.poetry]
name = "bbdl"
version = "0.1.0"
description = ""
authors = ["bissli <bissli@xyz.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

more-itertools = "*"

libb-ftp = { git = "https://github.com/bissli/libb-ftp" }
libb-log = { git = "https://github.com/bissli/libb-log", optional = true }

pytest = { version = "*", optional = true }
asserts = { version = "*", optional = true }
coverage = { version = "*", optional = true }
mutmut = { version = "*", optional = true }

[tool.poetry.extras]
test = [
  "pytest",
  "asserts",
  "coverage",
  "mutmut",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mutmut]
source_paths = ["src/bbdl"]
do_not_mutate = [
  "src/bbdl/assets.py",
  ]
also_copy = ["tests/"]
pytest_add_cli_args_test_selection = ["tests/"]
